name: Job Auto Apply Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-job-apply:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone claude-autopilot (private)
        run: |
          git clone "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/tamilts124/claude-autopilot.git" webauto

      - name: Clone job-apply data (private)
        run: |
          New-Item -ItemType Directory -Force -Path "D:\ClaudeDir"
          git clone "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/tamilts124/job-apply.git" "D:\ClaudeDir\job-apply"

      - name: Clone mcp-common-server
        run: |
          git clone "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/tamilts124/mcp-common-server.git" webauto/repos/mcp-common-server

      - name: Restore Environment Files (.env)
        env:
          RAW_MCP_ENV: ${{ secrets.MCP_ENV }}
          RAW_CLAUDE_ENV: ${{ secrets.CLAUDE_ENV }}
        run: |
          if ($env:RAW_MCP_ENV) {
            [System.IO.File]::WriteAllText("webauto/repos/mcp-common-server/.env", $env:RAW_MCP_ENV, [System.Text.Encoding]::UTF8)
            Write-Host "Restored webauto/repos/mcp-common-server/.env"
          }
          if ($env:RAW_CLAUDE_ENV) {
            [System.IO.File]::WriteAllText("webauto/.env", $env:RAW_CLAUDE_ENV, [System.Text.Encoding]::UTF8)
            Write-Host "Restored webauto/.env"
          }

      - name: Install Node Dependencies
        working-directory: webauto/repos/mcp-common-server
        run: |
          npm install
          npx playwright install chromium

      - name: Install Python Dependencies
        working-directory: webauto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install curl_cffi requests
          playwright install chromium

      - name: Start MCP Common Server on Port 3000
        working-directory: webauto/repos/mcp-common-server
        run: |
          $process = Start-Process node -ArgumentList "server-http.js", "--category=email_database,execution_process,git,write_edit,read_file_system,browser_automation" -PassThru -NoNewWindow
          Write-Host "Started MCP server with PID: $($process.Id)"
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 3000)
              if ($tcp.Connected) {
                $tcp.Close()
                Write-Host "MCP server is successfully listening on port 3000."
                $ready = $true
                break
              }
            } catch {}
          }
          if (-not $ready) {
            Write-Error "MCP server did not start on port 3000 within 30 seconds."
            exit 1
          }

      - name: Run Web Automation
        working-directory: webauto
        run: |
          python main.py --delete-all-old-chats --reuse-cookies --no-reuse-cookies-exit --modal "sonnet 4.6" --model-thinking no --model-efficiency low --carry-last-responses 1 --UniMail --session-loop --input .\prompts\job_apply_naukri.txt --recursive --mcp-running-port 3000

      - name: Push Job Apply Updates to Private Repo
        if: always()
        run: |
          if (Test-Path "D:\ClaudeDir\job-apply\.git") {
            cd D:\ClaudeDir\job-apply
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            $status = git status --porcelain
            if ($status) {
              Write-Host "Detected changes in job-apply data. Pushing to private repo..."
              git commit -m "Auto-update job applied db & cookies [skip ci]"
              git push "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/tamilts124/job-apply.git" HEAD:main
              Write-Host "Successfully pushed updates to job-apply."
            } else {
              Write-Host "No changes in job-apply data."
            }
          }

      - name: Push Claude Autopilot Updates to Private Repo
        if: always()
        run: |
          if (Test-Path "webauto\.git") {
            cd webauto
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            $status = git status --porcelain
            if ($status) {
              Write-Host "Detected changes in claude-autopilot. Pushing to private repo..."
              git commit -m "Auto-update session cookies and states [skip ci]"
              git push "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/tamilts124/claude-autopilot.git" HEAD:main
              Write-Host "Successfully pushed updates to claude-autopilot."
            } else {
              Write-Host "No changes in claude-autopilot."
            }
          }

      - name: Prepare Artifacts for Upload
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path "run_output"
          if (Test-Path "D:\ClaudeDir\job-apply\job_applied.db") {
            Copy-Item "D:\ClaudeDir\job-apply\job_applied.db" -Destination "run_output/" -Force
          }
          if (Test-Path "D:\ClaudeDir\job-apply\screenshots") {
            Copy-Item "D:\ClaudeDir\job-apply\screenshots" -Destination "run_output/screenshots" -Recurse -Force
          }
          if (Test-Path "webauto/chat_logs") {
            Copy-Item "webauto/chat_logs" -Destination "run_output/chat_logs" -Recurse -Force
          }
          if (Test-Path "webauto/logs") {
            Copy-Item "webauto/logs" -Destination "run_output/logs" -Recurse -Force
          }

      - name: Upload Logs & Database Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: run_output/
          if-no-files-found: ignore
